<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StudyVerse 9 — Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>

  <link rel="stylesheet" href="brand.css">

  <style>
    /* =====================================================
       STUDYVERSE 9
       NEW LEARNING-HUB DASHBOARD
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    :root {
      --sv-purple: #6b55e9;
      --sv-blue: #398df4;
      --sv-cyan: #31c9df;
      --sv-dark: #17172b;
      --sv-muted: #85889c;
      --sv-border: rgba(80, 80, 130, .10);
      --sv-card: rgba(255, 255, 255, .82);
      --sv-bg: #f6f8ff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 5% 0%,
          rgba(108, 84, 233, .10),
          transparent 28%
        ),
        radial-gradient(
          circle at 100% 10%,
          rgba(49, 201, 223, .09),
          transparent 25%
        ),
        var(--sv-bg);
      color: var(--sv-dark);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    #three-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -10;
      pointer-events: none;
      opacity: .65;
    }

    /* =====================================================
       APP LAYOUT
       ===================================================== */

    .app {
      min-height: 100vh;
      display: flex;
    }

    /* =====================================================
       SIDEBAR
       ===================================================== */

    .sidebar {
      width: 250px;
      min-height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 50;

      display: flex;
      flex-direction: column;

      padding: 22px 15px;

      background: rgba(255,255,255,.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      border-right: 1px solid var(--sv-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;

      padding: 5px 10px 27px;
    }

    .brand-nine {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      color: white;
      font-size: 24px;
      font-weight: 900;

      background:
        linear-gradient(
          135deg,
          #7057ed,
          #398df4 62%,
          #31c9df
        );

      box-shadow:
        0 13px 28px rgba(88, 78, 220, .25);
    }

    .brand-name strong {
      display: block;
      font-size: 17px;
      letter-spacing: -.5px;
    }

    .brand-name span {
      display: block;
      margin-top: 2px;

      color: #9295a8;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .nav-heading {
      padding: 9px 12px;

      color: #a0a2b1;

      font-size: 9px;
      font-weight: 850;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .navigation {
      display: grid;
      gap: 4px;
    }

    .navigation a {
      display: flex;
      align-items: center;
      gap: 11px;

      padding: 11px 12px;

      border-radius: 12px;

      color: #66697c;

      font-size: 12px;
      font-weight: 650;

      transition: .2s ease;
    }

    .navigation a:hover {
      background: rgba(107,85,233,.08);
      color: var(--sv-purple);
      transform: translateX(2px);
    }

    .navigation a.active {
      color: #5744d1;
      background:
        linear-gradient(
          135deg,
          rgba(107,85,233,.13),
          rgba(57,141,244,.08)
        );
      font-weight: 800;
    }

    .nav-icon {
      width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      border-radius: 9px;

      background: rgba(100,100,140,.07);

      font-size: 15px;
    }

    .navigation a.active .nav-icon {
      background: rgba(107,85,233,.13);
    }

    .sidebar-spacer {
      flex: 1;
    }

    .student-mini {
      padding: 13px;

      border-radius: 17px;

      border: 1px solid var(--sv-border);
      background: rgba(255,255,255,.65);
    }

    .student-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 39px;
      height: 39px;

      display: grid;
      place-items: center;

      border-radius: 12px;

      color: white;
      font-size: 13px;
      font-weight: 850;

      background:
        linear-gradient(
          135deg,
          var(--sv-purple),
          var(--sv-blue)
        );
    }

    .student-info {
      min-width: 0;
    }

    .student-info strong {
      display: block;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 12px;
    }

    .student-info span {
      display: block;
      margin-top: 2px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      color: #999cad;
      font-size: 9px;
    }

    /* =====================================================
       MAIN
       ===================================================== */

    .main {
      width: calc(100% - 250px);
      margin-left: 250px;

      padding: 25px 32px 55px;
    }

    .mobile-topbar {
      display: none;
    }

    /* =====================================================
       TOPBAR
       ===================================================== */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 25px;
    }

    .greeting {
      color: #9093a5;
      font-size: 12px;
    }

    .title {
      margin: 3px 0 0;

      font-size: clamp(26px, 3vw, 37px);
      line-height: 1.05;

      letter-spacing: -1.7px;
    }

    .title span {
      color: var(--sv-purple);
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .top-btn {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border: 1px solid var(--sv-border);
      border-radius: 12px;

      background: rgba(255,255,255,.75);

      cursor: pointer;

      transition: .2s;
    }

    .top-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(40,50,100,.08);
    }

    /* =====================================================
       HERO
       ===================================================== */

    .hero {
      position: relative;
      overflow: hidden;

      min-height: 245px;

      padding: 31px;

      border-radius: 27px;

      color: white;

      background:
        radial-gradient(
          circle at 82% 20%,
          rgba(55,210,238,.25),
          transparent 28%
        ),
        radial-gradient(
          circle at 70% 110%,
          rgba(117,76,255,.38),
          transparent 42%
        ),
        linear-gradient(
          120deg,
          #17172f,
          #332871 55%,
          #126ea9
        );

      box-shadow:
        0 25px 60px rgba(50,45,130,.18);
    }

    .hero::before {
      content: "";

      position: absolute;

      width: 330px;
      height: 330px;

      right: -80px;
      top: -150px;

      border-radius: 50%;

      border: 1px solid rgba(255,255,255,.13);

      box-shadow:
        0 0 0 35px rgba(255,255,255,.025),
        0 0 0 75px rgba(255,255,255,.018),
        0 0 0 115px rgba(255,255,255,.012);
    }

    .hero-symbols {
      position: absolute;

      right: 50px;
      bottom: 34px;

      color: rgba(255,255,255,.12);

      font-size: 27px;
      letter-spacing: 17px;

      transform: rotate(-8deg);
    }

    .hero-content {
      position: relative;
      z-index: 2;

      max-width: 650px;
    }

    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 7px 11px;

      border: 1px solid rgba(255,255,255,.13);
      border-radius: 999px;

      background: rgba(255,255,255,.09);

      font-size: 9px;
      font-weight: 850;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hero h2 {
      margin: 16px 0 9px;

      font-size: clamp(27px, 4vw, 44px);
      line-height: 1.03;

      letter-spacing: -2px;
    }

    .hero p {
      max-width: 580px;

      margin: 0;

      color: rgba(255,255,255,.72);

      font-size: 13px;
      line-height: 1.6;
    }

    .hero-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-top: 21px;
      padding: 11px 16px;

      border: 0;
      border-radius: 11px;

      background: white;
      color: #382d83;

      font-size: 11px;
      font-weight: 850;

      cursor: pointer;

      transition: .2s;
    }

    .hero-button:hover {
      transform: translateY(-2px);
    }

    /* =====================================================
       SECTION
       ===================================================== */

    .section {
      margin-top: 27px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;

      margin-bottom: 13px;
    }

    .section-heading h2 {
      margin: 0;

      font-size: 19px;
      letter-spacing: -.5px;
    }

    .section-heading p {
      margin: 3px 0 0;

      color: #9497a8;
      font-size: 10px;
    }

    .view-all {
      color: var(--sv-purple);

      font-size: 10px;
      font-weight: 850;
    }

    /* =====================================================
       LEARNING TOOLS
       ===================================================== */

    .tool-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 13px;
    }

    .tool-card {
      position: relative;

      min-height: 145px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      padding: 17px;

      overflow: hidden;

      border: 1px solid var(--sv-border);
      border-radius: 19px;

      background: var(--sv-card);

      box-shadow:
        0 12px 35px rgba(45,55,120,.045);

      cursor: pointer;

      transition:
        transform .24s ease,
        box-shadow .24s ease,
        border-color .24s ease;
    }

    .tool-card::after {
      content: "";

      position: absolute;

      width: 90px;
      height: 90px;

      right: -35px;
      bottom: -45px;

      border-radius: 50%;

      background: var(--tool-glow, rgba(107,85,233,.08));
    }

    .tool-card:hover {
      transform: translateY(-5px);

      border-color: rgba(107,85,233,.18);

      box-shadow:
        0 22px 45px rgba(45,55,120,.10);
    }

    .tool-icon {
      width: 43px;
      height: 43px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background:
        var(--tool-bg, rgba(107,85,233,.11));

      font-size: 20px;
    }

    .tool-name {
      margin-top: 12px;

      font-size: 13px;
      font-weight: 850;
    }

    .tool-description {
      margin-top: 4px;

      color: #9699aa;

      font-size: 9px;
      line-height: 1.4;
    }

    .tool-arrow {
      position: absolute;

      right: 15px;
      top: 18px;

      color: #a1a3b1;

      font-size: 13px;
    }

    /* =====================================================
       LIBRARY
       ===================================================== */

    .library-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 13px;
    }

    .library-card {
      position: relative;

      display: flex;
      align-items: center;
      gap: 15px;

      padding: 18px;

      border: 1px solid var(--sv-border);
      border-radius: 19px;

      background: rgba(255,255,255,.80);

      cursor: pointer;

      transition: .22s;
    }

    .library-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 35px rgba(40,50,100,.07);
    }

    .book-icon {
      width: 53px;
      height: 63px;

      flex: 0 0 auto;

      display: grid;
      place-items: center;

      border-radius: 9px 13px 13px 9px;

      color: white;

      font-size: 22px;
      font-weight: 900;

      background:
        linear-gradient(
          145deg,
          #6d55e9,
          #358fe8
        );

      box-shadow:
        inset 4px 0 rgba(0,0,0,.08);
    }

    .library-info {
      min-width: 0;
    }

    .library-info small {
      color: #9295a6;

      font-size: 9px;
      font-weight: 750;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .library-info h3 {
      margin: 5px 0 3px;

      font-size: 14px;
    }

    .library-info p {
      margin: 0;

      color: #9699aa;

      font-size: 9px;
    }

    .coming {
      display: inline-block;

      margin-top: 6px;
      padding: 3px 7px;

      border-radius: 999px;

      color: #7c7895;

      background: #f0eff8;

      font-size: 8px;
      font-weight: 800;
    }

    /* =====================================================
       LOWER AREA
       ===================================================== */

    .lower-grid {
      display: grid;

      grid-template-columns:
        1.25fr .75fr;

      gap: 13px;
    }

    .panel {
      min-height: 170px;

      padding: 19px;

      border: 1px solid var(--sv-border);
      border-radius: 19px;

      background: rgba(255,255,255,.80);
    }

    .panel-title {
      margin: 0;

      font-size: 15px;
    }

    .panel-subtitle {
      margin: 4px 0 0;

      color: #979aaa;

      font-size: 9px;
    }

    .empty-state {
      padding: 32px 10px;

      text-align: center;

      color: #9a9dad;

      font-size: 10px;
    }

    .empty-state-icon {
      margin-bottom: 8px;

      font-size: 24px;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 1100px) {

      .tool-grid {
        grid-template-columns:
          repeat(3, minmax(0,1fr));
      }

      .lower-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 800px) {

      .sidebar {
        display: none;
      }

      .main {
        width: 100%;
        margin-left: 0;

        padding:
          15px
          15px
          85px;
      }

      .mobile-topbar {
        display: flex;

        align-items: center;
        justify-content: space-between;

        margin-bottom: 18px;
      }

      .mobile-brand {
        display: flex;
        align-items: center;
        gap: 9px;

        font-size: 15px;
        font-weight: 850;
      }

      .mobile-brand .brand-nine {
        width: 36px;
        height: 36px;

        font-size: 19px;

        border-radius: 11px;
      }

      .topbar {
        margin-bottom: 17px;
      }

      .top-actions {
        display: none;
      }

      .hero {
        min-height: 285px;

        padding: 24px 20px;

        border-radius: 22px;
      }

      .hero-symbols {
        right: 15px;
        bottom: 25px;

        font-size: 17px;
        letter-spacing: 8px;
      }

      .tool-grid {
        grid-template-columns:
          repeat(2, minmax(0,1fr));

        gap: 10px;
      }

      .tool-card {
        min-height: 137px;

        padding: 14px;
      }

      .library-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 430px) {

      .title {
        font-size: 27px;
      }

      .hero h2 {
        font-size: 28px;
      }

      .tool-name {
        font-size: 12px;
      }

      .tool-description {
        font-size: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }

  </style>
</head>

  <canvas id="three-bg"></canvas>


  <div class="app">

         ================================================= -->
