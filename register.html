<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account — StudyVerse 9</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <link rel="stylesheet" href="brand.css">
</head>

<body class="auth-page">

  <canvas id="three-bg"></canvas>

  <main class="auth-shell">

    <a href="index.html" class="auth-brand">
      <div class="brand-nine">9</div>

      <div>
        <strong>StudyVerse</strong>
        <span>CLASS 9</span>
      </div>
    </a>

    <section class="auth-card">

      <div class="auth-heading">

        <span class="eyebrow">
          START YOUR JOURNEY
        </span>

        <h1>
          Create your<br>
          StudyVerse account.
        </h1>

        <p>
          Join StudyVerse 9 and keep your chapters,
          resources and learning progress in one place.
        </p>

      </div>

      <form id="registerForm">

        <div class="field">
          <label for="name">Full name</label>

          <input
            id="name"
            type="text"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email address</label>

          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">

          <div class="field-top">
            <label for="password">Password</label>

            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
            >
              Show
            </button>
          </div>

          <input
            id="password"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </div>

        <div class="field">

          <div class="field-top">
            <label for="confirmPassword">
              Confirm password
            </label>

            <button
              type="button"
              id="toggleConfirmPassword"
              class="password-toggle"
            >
              Show
            </button>
          </div>

          <input
            id="confirmPassword"
            type="password"
            placeholder="Enter password again"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </div>

        <button
          type="submit"
          id="registerButton"
          class="primary-btn"
        >
          <span id="registerButtonText">
            Create account
          </span>
        </button>

        <p
          id="registerMessage"
          class="auth-message"
          aria-live="polite"
        ></p>

      </form>

      <div class="auth-divider">
        <span>ALREADY HAVE AN ACCOUNT?</span>
      </div>

      <a
        href="login.html"
        class="secondary-btn"
      >
        Sign in instead
      </a>

      <a
        href="index.html"
        class="back-link"
      >
        ← Back to StudyVerse 9
      </a>

    </section>

  </main>

  <script src="three-bg.js"></script>

  <script>

    const form =
      document.getElementById("registerForm");

    const nameInput =
      document.getElementById("name");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const registerButton =
      document.getElementById("registerButton");

    const registerButtonText =
      document.getElementById("registerButtonText");

    const registerMessage =
      document.getElementById("registerMessage");

    const togglePassword =
      document.getElementById("togglePassword");

    const toggleConfirmPassword =
      document.getElementById("toggleConfirmPassword");


    /* =====================================
       MESSAGE
       ===================================== */

    function showMessage(message, type = "error") {

      registerMessage.textContent = message;
      registerMessage.dataset.type = type;

    }


    /* =====================================
       LOADING
       ===================================== */

    function setLoading(loading) {

      registerButton.disabled = loading;

      registerButtonText.textContent =
        loading
          ? "Creating account..."
          : "Create account";

    }


    /* =====================================
       PASSWORD VISIBILITY
       ===================================== */

    togglePassword.addEventListener(
      "click",
      () => {

        const hidden =
          passwordInput.type === "password";

        passwordInput.type =
          hidden ? "text" : "password";

        togglePassword.textContent =
          hidden ? "Hide" : "Show";

      }
    );


    toggleConfirmPassword.addEventListener(
      "click",
      () => {

        const hidden =
          confirmPasswordInput.type === "password";

        confirmPasswordInput.type =
          hidden ? "text" : "password";

        toggleConfirmPassword.textContent =
          hidden ? "Hide" : "Show";

      }
    );


    /* =====================================
       REGISTRATION
       ===================================== */

    form.addEventListener(
      "submit",
      async (event) => {

        /* STOP NORMAL PAGE RELOAD */
        event.preventDefault();

        showMessage("");

        const name =
          nameInput.value.trim();

        const email =
          emailInput.value.trim().toLowerCase();

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        /* VALIDATION */

        if (!name) {

          showMessage(
            "Please enter your full name."
          );

          nameInput.focus();

          return;
        }


        if (!email) {

          showMessage(
            "Please enter your email address."
          );

          emailInput.focus();

          return;
        }


        if (password.length < 6) {

          showMessage(
            "Password must be at least 6 characters."
          );

          passwordInput.focus();

          return;
        }


        if (password !== confirmPassword) {

          showMessage(
            "The passwords do not match."
          );

          confirmPasswordInput.focus();

          return;
        }


        /*
          IMPORTANT:

          app.js creates the Supabase client as:

          const sb = createClient(...)

          Therefore we use `sb` directly.
        */

        setLoading(true);


        try {

          const {
            data,
            error
          } = await sb.auth.signUp({

            email: email,

            password: password,

            options: {
              data: {
                full_name: name
              }
            }

          });


          /* SUPABASE ERROR */

          if (error) {

            console.error(
              "StudyVerse registration error:",
              error
            );

            const message =
              error.message || "Registration failed.";

            if (
              message
                .toLowerCase()
                .includes("already registered")
            ) {

              showMessage(
                "This email is already registered. Please sign in instead."
              );

            } else {

              showMessage(message);

            }

            return;
          }


          /* SUCCESS */

          console.log(
            "StudyVerse account created:",
            data
          );


          if (data.session) {

            showMessage(
              "Account created successfully! Opening StudyVerse...",
              "success"
            );

            setTimeout(
              () => {
                window.location.replace(
                  "dashboard.html"
                );
              },
              700
            );

          } else {

            /*
              This is only a fallback if Supabase
              creates the account without returning
              a session.
            */

            showMessage(
              "Account created. Please sign in to continue.",
              "success"
            );

            setTimeout(
              () => {
                window.location.replace(
                  "login.html"
                );
              },
              1200
            );

          }


        } catch (error) {

          console.error(
            "Unexpected StudyVerse registration error:",
            error
          );

          showMessage(
            "Something went wrong while creating your account. Please try again."
          );

        } finally {

          setLoading(false);

        }

      }
    );

  </script>

</body>
</html>
