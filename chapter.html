<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyVerse 9 — Chapter</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header class="topbar"><a class="brand" href="dashboard.html"><span class="logo">S9</span> StudyVerse 9</a><nav class="nav"><a href="chapters.html">All chapters</a><a href="dashboard.html">Dashboard</a><button onclick="signOut()">Sign out</button></nav></header><section id="chapterHead" class="hero"></section><section class="card"><div class="actions" style="justify-content:space-between"><h2>Learning resources</h2><input id="search" placeholder="Search this chapter..." style="max-width:280px"></div><div id="resources"></div></section></main><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
const cid=new URLSearchParams(location.search).get("id");
let all=[];
async function markComplete(){const u=await currentUser();if(!u)return;const {error}=await sb.from("chapter_progress").upsert({user_id:u.id,chapter_id:cid,completed:true,updated_at:new Date().toISOString()},{onConflict:"user_id,chapter_id"});if(error)toast(error.message,"error");else toast("Chapter marked complete.");}
function render(){const q=(search.value||"").toLowerCase();const rows=all.filter(r=>(r.title||"").toLowerCase().includes(q)||(r.description||"").toLowerCase().includes(q)||resourceType(r).toLowerCase().includes(q));resources.innerHTML=rows.map(r=>`<article class="resource"><div><span class="pill">${esc(resourceType(r))}</span><h3>${esc(r.title||"Untitled resource")}</h3><p class="muted">${esc(r.description||"")}</p></div><div class="actions"><button class="btn small" onclick='openResource(${JSON.stringify(r).replace(/</g,"\\u003c")})'>Open</button></div></article>`).join("")||'<div class="empty">No resources match your search.</div>'}
(async()=>{const u=await requireAuth();if(!u)return;try{const {data:ch,error:ce}=await sb.from("chapters").select("*").eq("id",cid).maybeSingle();if(ce)throw ce;if(!ch)throw new Error("Chapter not found.");chapterHead.innerHTML=`<span class="pill">Chapter ${esc(ch.chapter_number??ch.display_order)}</span><h1>${esc(ch.name)}</h1><p>${esc(ch.description||"")}</p><button class="btn" onclick="markComplete()">Mark chapter complete</button>`;const {data,error}=await sb.from("resources").select("*").eq("chapter_id",cid).eq("is_published",true).order("created_at",{ascending:false});if(error)throw error;all=data||[];render()}catch(e){toast(e.message,"error")} })();
search.oninput=render;
</script></body></html>
