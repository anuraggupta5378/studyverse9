<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyVerse 9 — Staff</title><link rel="stylesheet" href="admin.css"></head><body><header class="top"><div class="topin"><a class="brand" href="dashboard.html"><span class="logo">9</span>StudyVerse 9</a><button id="menuBtn" class="btn menu">☰</button><nav id="nav" class="nav"></nav><div class="actions"><a class="btn desktop-only" href="dashboard.html">Student view</a><button class="btn" onclick="signOut()">Sign out</button></div></div></header><main class="main"><section class="hero"><div><div class="eyebrow">STAFF WORKSPACE</div><h1>Create, submit, track.</h1><p>A clean workspace for drafts, review and feedback.</p></div><div class="mark">9</div></section><div id="staffMetrics" class="grid g4"></div><section class="section grid g2"><div class="card"><div class="head"><h2>My resource work</h2><button class="btn primary small" onclick="openStaffResource()">+ New draft</button></div><div id="staffResources"></div></div><div class="card"><div class="head"><h2>Review history</h2><button class="btn small" onclick="loadStaff()">Refresh</button></div><div id="staffReviews"></div></div></section><div class="card section"><h2>Staff workflow</h2><div class="grid g3"><div class="quick"><span class="qi">1</span><span><b class="qt">Draft</b><br><span class="qs">Create unpublished work.</span></span></div><div class="quick"><span class="qi">2</span><span><b class="qt">Submit</b><br><span class="qs">Send for manager review.</span></span></div><div class="quick"><span class="qi">3</span><span><b class="qt">Track</b><br><span class="qs">See approval or notes.</span></span></div></div></div></main><div id="staffModal" class="modal"><div class="card modalcard"><div class="modalhead"><h2>New draft</h2><button class="btn small" onclick="closeStaffModal()">Close</button></div><div class="field"><label>Title</label><input id="sTitle"></div><div class="field"><label>Chapter ID</label><input id="sChapter"></div><div class="field"><label>Type</label><select id="sType"><option>notes</option><option>solution</option><option>exercise</option><option>video</option><option>pdf</option><option>important</option></select></div><div class="field"><label>Description</label><textarea id="sDesc"></textarea></div><div class="field"><label>External URL (optional)</label><input id="sUrl"></div><button class="btn primary" onclick="saveStaffDraft()">Save draft</button></div></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script src="admin-nav.js"></script><script src="staff.js"></script></body></html>
