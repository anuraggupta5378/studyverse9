<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyVerse 9 — Chapters</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header class="topbar"><a class="brand" href="dashboard.html"><span class="logo">S9</span> StudyVerse 9</a><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="chapters.html">Learn</a><button onclick="signOut()">Sign out</button></nav></header><section class="hero"><span class="pill">Mathematics</span><h1>Ganita Manjari</h1><p>Part 1 contains the eight chapters currently configured in StudyVerse 9. Part 2 is locked until its content is added.</p></section><div class="card"><h2>Part 1</h2><div id="list" class="grid"></div></div><div class="card locked" style="margin-top:18px"><h2>Part 2 <span class="pill">Coming soon</span></h2><p class="muted">Content will appear here when it is added and published by the admin.</p></div></main><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
